name: "Credo"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Credo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: 29
          elixir-version: '1.20'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-deps
        with:
          path: |
            deps
            _build
            !_build/test/lib/ex_png
          key: ${{runner.os}}-1.20-credo-deps-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: mix deps.get
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: MIX_ENV=test mix deps.compile
      - run: MIX_ENV=test mix credo --all


