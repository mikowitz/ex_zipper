name: "CI Tests"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: "[${{matrix.otp}}/${{matrix.elixir}}] CI Tests"
    strategy:
      matrix:
        otp: [27, 28, 29]
        elixir: ['1.17', '1.18', '1.19', '1.20']
        exclude:
          - elixir: '1.17'
            otp: 28
          - elixir: '1.17'
            otp: 29
          - elixir: '1.18'
            otp: 28
          - elixir: '1.18'
            otp: 29
          - elixir: '1.19'
            otp: 29
    steps:
      - uses: actions/checkout@v2.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-elixir@v1.5
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - uses: actions/cache@v2
        id: cache-deps
        with:
          path: |
            deps
            _build
            !_build/test/lib/ex_png
          key: ${{runner.os}}-${{matrix.elixir}}-${{matrix.otp}}-deps-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: mix deps.get
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: MIX_ENV=test mix deps.compile
      - run: MIX_ENV=test mix test

